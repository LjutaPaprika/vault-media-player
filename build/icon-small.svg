<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- icon.svg simplified for 16-24px: no bolts, a heavier rim and a bigger hub,
       so the door and the play button still read at taskbar and Explorer sizes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="94" fill="none" stroke="#e8b44b" stroke-width="30"/>
  <circle cx="128" cy="128" r="58" fill="#e8b44b"/>
  <path d="M110 98 L160 128 L110 158 Z" fill="#141417" stroke="#141417" stroke-width="8" stroke-linejoin="round"/>
</svg>
