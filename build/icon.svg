<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Vault's mark: a gold vault door with a play button for a hub. The same
       drawing lives in src/renderer/src/components/VaultMark.tsx; keep the two
       in step. Sizes of 24px and below use icon-small.svg (no bolts). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#121215"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="0.55" stop-color="#e8b44b"/>
      <stop offset="1" stop-color="#b9842a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#gold)" stroke-width="20"/>
  <g fill="url(#gold)">
    <circle cx="128" cy="58" r="7"/>
    <circle cx="177.5" cy="78.5" r="7"/>
    <circle cx="198" cy="128" r="7"/>
    <circle cx="177.5" cy="177.5" r="7"/>
    <circle cx="128" cy="198" r="7"/>
    <circle cx="78.5" cy="177.5" r="7"/>
    <circle cx="58" cy="128" r="7"/>
    <circle cx="78.5" cy="78.5" r="7"/>
  </g>
  <circle cx="128" cy="128" r="46" fill="url(#gold)"/>
  <path d="M114 104 L152 128 L114 152 Z" fill="#141417" stroke="#141417" stroke-width="6" stroke-linejoin="round"/>
</svg>
